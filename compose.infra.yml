services:
  infra:
    image: ministackorg/ministack

    ports:
      - "127.0.0.1:4566:4566"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
